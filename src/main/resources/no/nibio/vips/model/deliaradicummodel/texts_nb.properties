name=Liten k\u00e5lflue-modell
description={{filename="/images/ef-20050805-120428.jpg" description="Foto: E. Fl\u00f8istad"}}\n<h2>Modellbeskrivelse</h2>\n<p>Modellen er en svermetidspunktmodell, og gir informasjon om antatt tid for begynnende og fortsatt egglegging hos liten k&aring;lflue i k&aring;lvekster. Modellen gjelder kun liten k&aring;lflue (ikke stor k&aring;lflue).</p>\n<p>Grunnlaget for varslingen er data fra studier av klekke og eggleggingstid hos k&aring;lfluene i Norgesprosjektet (LR, 1999-2001), Nye metoder for bekjempelse av k&aring;lfluer (forskerprosjekt, NFR, 2004-2007) samt et brukerstyrt prosjekt i regi av Norges Gartnerforbund (2005-2007). Dette er publisert i Johansen og Meadow (2002, 2005, 2006), Johansen (2007) og Meadow m. flere (2008). K&aring;lfluene begynner &aring; legge egg 5-7 dager etter klekking. V&aring;re data tilsier at begynnende egglegging i gjennomsnitt krever en temperatursum p&aring; rundt 160 graddager (d&oslash;gngrader) basert p&aring; jordtemperaturer (10 cm) (d&oslash;gngrader &gt; 4 &deg;C). Basert p&aring; standard lufttemperaturer (2 m over bakken) de samme stedene, ble begynnende egglegging registrert n&aring;r gjennomsnittlig temperatursum passerte ca 210 graddager. Resultatene underst&oslash;ttes av britiske observasjoner (Collier og Finch, 1985, 179 og 230 graddager til 50 % klekking, for jord og lufttemperaturer). V&aring;re beregninger viste til dels stor variasjon og varslingen vil dermed bare v&aelig;re r&aring;dgivende. Bruk av denne varslingsmodellen b&oslash;r kombineres med direkte eggobservasjoner i &aring;keren for &aring; f&aring; begrep om angrepsgraden ogs&aring;.</p>\n<p>Det benyttes historiske v&aelig;rdata og v&aelig;rprognoser (2 dagers) i modellen. M&aring;lte parametere som inng&aring;r i modellen er standard lufttemperatur (TM) eller jordtemperatur i 10 cm (TMJ 10), timesverdier. Jordtemperatur benyttes dersom denne er tilgjengelig. Beregnede parametere: D&oslash;gnmiddelverdier med 4 &deg;C basistemperatur (dvs. d&oslash;gnmiddel minus 4 &deg;C). 4 &deg;C er en teoretisk beregnet nedre temperatursum for post-diapauseutvikling.</p>\n<p>Modellen er utviklet av Dr. Tor J. Johansen, NIBIO.</p>\n<h2>Tolking av varsel</h2>\n<p>Varsel kan beregnes enten basert p&aring; jordtemperatur eller lufttemperatur. Der v&aelig;rstasjonen m&aring;ler jordtemperatur i tillegg til lufttemperatur, er det jordtemperatur som blir benyttet i varslet som presenteres p&aring; kartsiden og i tabellen under grafen. I grafen vil man kunne se b&aring;de jordtemperatur og lufttemperatur samt d&oslash;gngradberegninger og terskelverdier tilknyttet disse.\u0008</p>\n<ul>\n<li>Gr&oslash;nne bokser betyr at det ikke er forventet egglegging. Temperatursum for sverming er ikke oppn&aring;dd. Gr&oslash;nne bokser presenteres kun i perioden f&oslash;r forventet p&aring;begynt egglegging.</li>\n<li>Gule bokser betyr at f&oslash;rste egglegging n&aelig;rmer seg. V&aelig;r observant og sjekk i egen &aring;ker. Gule bokser presenteres f&oslash;rste gang ved oppn&aring;dd 140 d&oslash;gngrader (jordtemperatur) eller 185 d&oslash;gngrader (lufttemperatur). Dette tilsvarer ca to normale v&aring;rdager f&oslash;r forventet begynnende egglegging.</li>\n<li>R&oslash;de bokser betyr at man kan forvente p&aring;begynt egglegging. Kravet til temperatursum er oppn&aring;dd; 160 d&oslash;gngrader (jordtemperatur) eller 210 d&oslash;gngrader (lufttemperatur)</li>\n</ul>\n<p>Den grafiske presentasjonen viser utviklingen av d&oslash;gngradsberegningen som ligger til grunn for de gr&oslash;nne, gule og r&oslash;de varslene (linjene: &laquo;D&oslash;gngrader basistemperatur 4 grader Celsius&raquo; og &laquo;Middeltemperatur i jord, 10 cm dybde, basistemp 4 grader Celsius&raquo;). Grafen viser rette horisontale linjer for terskelverdiene. Det er et sett med terskelverdier tilknyttet jordtemperatur (p&aring; de v&aelig;rstasjoner dette m&aring;les) og et sett terskelverdier tilknyttet lufttemperatur.</p>\n<h3>Jordtemperatur</h3>\n<p>&laquo;Nedre terskel for aggregert jordtemperatur&raquo; tilsvarer terskelen der varsel g&aring;r fra gr&oslash;nt til gult basert p&aring; jordtemperatur (140 d&oslash;gngrader). &laquo;&Oslash;vre terskel for aggregert jordtemperatur&raquo; tilsvarer terskelen der varsel g&aring;r fra gult til r&oslash;dt basert p&aring; jordtemperatur (160 d&oslash;gngrader). N&aring;r linjen &laquo;Middeltemperatur i jord, 10 cm dybde, basistemp 4 grader Celsius&raquo; krysser en av linjene for aggregert jordtemperatur, vil varslet n&aring; neste niv&aring; og fargen p&aring; varslingsboksene p&aring; kartsiden i VIPS endres.</p>\n<h3>Lufttemperatur</h3>\n<p>(benyttes dersom jordtemperatur ikke er tilgjengelig) &laquo;Nedre terskel for aggregert lufttemperatur&raquo; tilsvarer terskelen der varsel g&aring;r fra gr&oslash;nt til gult basert p&aring; lufttemperatur (185 d&oslash;gngrader). &laquo;&Oslash;vre terskel for aggregert lufttemperatur&raquo; tilsvarer terskelen der varsel g&aring;r fra gult til r&oslash;dt basert p&aring; lufttemperatur (210 d&oslash;gngrader). N&aring;r linjen &laquo;D&oslash;gngrader basistemperatur 4 grader Celsius&raquo; krysser en av linjene for aggregert lufttemperatur, vil varslet n&aring; neste niv&aring; og fargen p&aring; varslingsboksene p&aring; kartsiden i VIPS endres.</p>\n<p>V&aelig;r klar over at i omr&aring;der med dekke (plast, enkel og dobbel fiberduk el. lign.) (enten p&aring; samme jorde eller nabojorder) &aring;ret f&oslash;r, kan svermingen starte tidligere p&aring; grunn av h&oslash;yere jordtemperatur under dekket.</p>\n<p>Bruk av denne varslingsmodellen b&oslash;r kombineres med direkte eggobservasjoner i &aring;keren. B&aring;de p&aring; grunn av stor variasjon og for &aring; f&aring; et inntrykk av angrepsgraden.</p>\n<p>I Nord-Norge vil stor k&aring;lflue normalt starte egglegging 10-14 dager etter liten k&aring;lflue. For S&oslash;r-Norge er det ikke en slik sammenheng.</p>\n<h2>Varslingssesong &ndash; oppstart og avslutning av varsel</h2>\n<h3>Starttidspunkt</h3>\n<p>N&aring;r jordtemperaturen begynner &aring; bevege seg over 0, senest n&aring;r middeltemperatur i jord (10cm) (TMJ 10) for d&oslash;gnet overstiger 4 &deg;C. Rent teknisk er modellens startdato 1. mars (n&aring;r det er telefritt/sn&oslash;fritt etter 1. mars).</p>\n<h3>Sluttidspunkt</h3>\n<p>1. juli fra Tr&oslash;ndelag og s&oslash;rover, 15. juli fra Nordland og nordover</p>\n<h2>Utpr&oslash;ving og validering av modellen</h2>\n<h3>Nasjonalt</h3>\n<p>Modellen er ikke validert etter at den ble tatt i bruk i VIPS i 2008, men bakgrunn for modellen er norske data for klekketidspunkt og eggleggingstidspunkt ulike steder i landet.</p>\n<h3>Internasjonalt</h3>\n<p>Ikke aktuelt da modellen er basert p&aring; norske data. Det foreligger imidlertid informasjon om klekketidspunkter fra andre land (Collier &amp; Finch, 1985) og liknende d&oslash;gngradsmodeller er laget og benyttet internasjonalt.</p>\n<h2>Referanser</h2>\n<p>Johansen, T.J. &amp; R. Meadow 2002. Bekjempelse av k&aring;lfluene - fra teori til praksis. Gr&oslash;nn forskning 2/2002: 117-122.</p>\n<p>Johansen, T.J. &amp; R. Meadow 2005. Emergence patterns of Norwegian brassica root fly populations. IOBC/WPRS Bulletin 28 (4): 25-29.</p>\n<p>Johansen TJ og R. Meadow 2006. Population differences in emergence of brassica root flies (Diptera: Anthomyiidae). Environmental Entomology 35: 1161-1165.</p>\n<p>Johansen, T.J. 2007. K&aring;lfluene &ndash; biologi og mulige tiltak. Bioforsk Fokus 2 (13): 33-35.</p>\n<p>Meadow, R., T.J. Johansen, R. Selj&aring;sen og S. Haukeland 2008. Hva n&aring; lille flue? Oppsummering fra k&aring;lflueprosjekter. Bioforsk Fokus 3 (1): 10-12.</p>\n<p>Collier, R. and S. Finch 1985. Accumulated temperatures for predicting the time of emergence in the spring of the cabbage fly, Delia radicum (L.) (Diptera: Anthomyiidae)</p>\n<p>Tiilikkala, K. and H. Ojanen 1999. Use of geographical information system (GIS) for forecasting the activities of carrot fly and cabbage root fly. IOBC/WPRS Bulletin 22 (5): 15-24.</p>\n<h2>Kontaktpersoner</h2>\n<p><a href="http://www.nibio.no/ansatte/tor_johansen" target="_blank">Tor J. Johansen</a>&nbsp;og <a href="http://www.nibio.no/ansatte/annette_folkedalschjll" target="_blank">Annette F. Schj&oslash;ll</a>&nbsp;</p>\n<h2>Mer informasjon</h2>\n<p><a href="http://leksikon.nibio.no/vieworganism.php?organismId=1_338&amp;cropGroupId=-1&amp;cropId=-1&amp;pestGroupId=-1&amp;showMacroOrganisms=false" target="_blank">K&aring;lflue i plantevernleksikonet</a></p>
statusInterpretation=<h2>Forklaring til grafen</h2>\n<p>Den grafiske presentasjonen viser utviklingen av d&oslash;gngradsberegningen som ligger til grunn for de gr&oslash;nne, gule og r&oslash;de varslene (linjene: &laquo;D&oslash;gngrader basistemperatur 4 grader Celsius&raquo; og &laquo;Middeltemperatur i jord, 10 cm dybde, basistemp 4 grader Celsius&raquo;). Grafen viser rette horisontale linjer for terskelverdiene. Det er et sett med terskelverdier tilknyttet jordtemperatur (p&aring; de v&aelig;rstasjoner dette m&aring;les) og et sett terskelverdier tilknyttet lufttemperatur.</p>\n<p>&laquo;Nedre terskel for aggregert jordtemperatur&raquo; tilsvarer terskelen der varsel g&aring;r fra gr&oslash;nt til gult basert p&aring; jordtemperatur (140 d&oslash;gngrader). &laquo;&Oslash;vre terskel for aggregert jordtemperatur&raquo; tilsvarer terskelen der varsel g&aring;r fra gult til r&oslash;dt basert p&aring; jordtemperatur (160 d&oslash;gngrader). N&aring;r linjen &laquo;Middeltemperatur i jord, 10 cm dybde, basistemp 4 grader Celsius&raquo; krysser en av linjene for aggregert jordtemperatur, vil varslet n&aring; neste niv&aring; og fargen p&aring; varslingsboksene p&aring; kartsiden i VIPS endres.</p>\n<p>&laquo;Nedre terskel for aggregert lufttemperatur&raquo; tilsvarer terskelen der varsel g&aring;r fra gr&oslash;nt til gult basert p&aring; lufttemperatur (185 d&oslash;gngrader). &laquo;&Oslash;vre terskel for aggregert lufttemperatur&raquo; tilsvarer terskelen der varsel g&aring;r fra gult til r&oslash;dt basert p&aring; lufttemperatur (210 d&oslash;gngrader).</p>\n<h2>Forklaring til tabellen</h2>\n<p>N&aring;r varselstatus er gr&oslash;nn, betyr dette at svermingen enda ikke har begynt og at det ikke er forventet egglegging.</p>\n<p>N&aring;r varselstatus er gul, betyr dette at svermingen er i startfasen og at f&oslash;rste egglegging n&aelig;rmer seg. V&aelig;r observant og sjekk egen &aring;ker.</p>\n<p>N&aring;r varselstatus er r&oslash;d, betyr dette at det er forventet p&aring;begynt egglegging. Kravet for sverming er oppn&aring;dd.</p>\n<p>N&aring;r varselstatus er gr&aring;, betyr dette at svermingen av 1. generasjon er over og varslingen er avsluttet.</p>\n<p> V&aelig;r klar over at i omr&aring;der med dekke (plast, enkel og dobbel fiberduk el. lign.) (enten p&aring; samme jorde eller nabojorder) &aring;ret f&oslash;r, kan svermingen starte tidligere p&aring; grunn av h&oslash;yere jordtemperatur under dekket.</p>\n<p>Bruk av denne varslingsmodellen b&oslash;r kombineres med direkte eggobservasjoner i egen &aring;ker. B&aring;de p&aring; grunn av stor variasjon og for &aring; f&aring; et inntrykk av angrepsgraden.</p>
usage=Description of required input parameters:\n\ntimeZone - What timezone the calculation is for. Necessary to calculate daily values from the provided hourly values. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")\n\nobservations - list of weather data. The following parameters are required:\n* TM - Mean temperature in deg Celcius\n* TJM10 - Mean soil temperature at 10 cm depth in deg Celcius\n\nThe model does not require TJM10, but i will give more accurate predictions if soil temperature is provided\n\nThe model starts aggregating the day degrees from the earliest weather data provided in the input data\n\nThese should all be complete timeseries of daily data from the same time period. The model accepts hourly data as well, and aggregates these into daily values.
